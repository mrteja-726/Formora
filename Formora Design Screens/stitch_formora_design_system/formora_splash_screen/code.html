<style>
        .splash-enter {
            animation: fadeScaleUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeScaleUp {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .bg-fade-in {
            animation: bgFade 1s ease-in forwards;
        }

        @keyframes bgFade {
            0% { background-color: #fbf8fe; } /* Starts slightly off-white like surface */
            100% { background-color: #ffffff; } /* Settles to lowest */
        }
    </style>
