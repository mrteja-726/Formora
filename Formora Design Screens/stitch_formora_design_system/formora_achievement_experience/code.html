<style>
        @keyframes modal-entrance {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes success-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 94, 184, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 94, 184, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 94, 184, 0); }
        }
        .animate-modal-entrance {
            animation: modal-entrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-success-pulse {
            animation: success-pulse 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .achievement-glow {
            filter: drop-shadow(0 0 12px rgba(0, 94, 184, 0.3));
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

</div>
</div>

                    Continue to Vault

<script>
        // Simple interactive feedback on buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', (e) => {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                button.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
