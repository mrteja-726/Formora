<script>
        // Simple script to handle visual states for the demo
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.profile-card');
            
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    // Prevent switching if clicking action buttons
                    if(e.target.closest('button')) return;

                    // Reset all cards to inactive state
                    cards.forEach(c => {
                        c.className = 'profile-card group relative overflow-hidden bg-surface border border-outline-variant/40 rounded-xl p-md flex items-center gap-md cursor-pointer hover:bg-surface-container-low hover:border-outline-variant/60 transition-all duration-200 transform hover:scale-[0.99] active:scale-[0.97]';
                        
                        // Fix text colors for inactive
                        const name = c.querySelector('h3');
                        if(name) name.className = 'font-title-md text-title-md text-on-surface truncate';
                        
                        const meta = c.querySelector('p');
                        if(meta) meta.className = 'font-label-lg text-label-lg text-on-surface-variant truncate mt-0.5 tracking-wide';
                        
                        // Hide checkmark, show actions on hover
                        const trailing = c.querySelector('.shrink-0.pl-2');
                        if(trailing) {
                            trailing.innerHTML = `
                                <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 shrink-0">
                                    <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface-variant hover:text-primary transition-colors">
                                        <span class="material-symbols-outlined text-[18px]">edit</span>
                                    </button>
                                    <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-error-container text-on-surface-variant hover:text-error transition-colors">
                                        <span class="material-symbols-outlined text-[18px]">delete</span>
                                    </button>
                                </div>
                            `;
                            trailing.className = 'flex items-center shrink-0';
                        }
                    });

                    // Set clicked card to active state
                    this.className = 'profile-card group relative overflow-hidden bg-primary-container border border-transparent rounded-xl p-md flex items-center gap-md cursor-pointer transition-all duration-200 transform hover:scale-[0.99] active:scale-[0.97]';
                    
                    const name = this.querySelector('h3');
                    if(name) name.className = 'font-title-md text-title-md text-on-primary-container truncate font-medium';
                    
                    const meta = this.querySelector('p');
                    if(meta) meta.className = 'font-label-lg text-label-lg text-on-primary-container/80 truncate mt-0.5 tracking-wide';

                    // Add checkmark
                    const trailingArea = this.querySelector('.shrink-0:last-child');
                    if(trailingArea) {
                         trailingArea.className = 'flex items-center gap-xs shrink-0 pl-2';
                         trailingArea.innerHTML = `
                             <div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary-fixed/20 text-on-primary-container">
                                 <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                             </div>
                         `;
                    }
                    
                    // Add subtle haptic feedback simulation (visual only)
                    this.style.transform = 'scale(0.96)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });
        });
    </script>
