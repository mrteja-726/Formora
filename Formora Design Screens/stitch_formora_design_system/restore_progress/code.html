<!-- Optional JS for subtle number ticking effect to enhance motion -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const percentageElement = document.getElementById('progress-text');
            let currentVal = 0;
            const targetVal = 42;
            const duration = 2000; // Match CSS animation duration
            const steps = 60;
            const stepTime = duration / steps;
            
            // Initial fast count up to match the circle fill
            let interval = setInterval(() => {
                if (currentVal >= targetVal) {
                    clearInterval(interval);
                    // Slow periodic simulated progress tick
                    setInterval(() => {
                        if(Math.random() > 0.7 && currentVal < 99) {
                            currentVal += 1;
                            percentageElement.innerText = currentVal + "%";
                        }
                    }, 4000);
                } else {
                    currentVal += Math.ceil(targetVal / steps);
                    if(currentVal > targetVal) currentVal = targetVal;
                    percentageElement.innerText = currentVal + "%";
                }
            }, stepTime);
        });
    </script>
