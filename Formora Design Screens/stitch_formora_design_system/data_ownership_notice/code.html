<div class="flex items-center gap-md p-md rounded-xl bg-surface-container/30 border border-outline-variant/20 backdrop-blur-sm">

<div class="flex items-center gap-md p-md rounded-xl bg-surface-container/30 border border-outline-variant/20 backdrop-blur-sm">

</div>
<div class="flex items-center gap-md p-md rounded-xl bg-surface-container/30 border border-outline-variant/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-title-md text-on-surface">No Formora Servers</span>
</div>
</div>
<div class="bg-surface-container-high rounded-xl p-lg flex items-start gap-md mb-2xl shadow-sm border border-outline-variant/10">

                If you delete the app without a backup, your data may be permanently lost.
            </p>

<div class="mt-auto md:mt-0 flex flex-col gap-xl">
<label class="flex items-center gap-md p-sm rounded-lg hover:bg-surface-container-low cursor-pointer transition-colors group -mx-sm">
<div class="relative flex items-center justify-center shrink-0">
<input class="peer appearance-none w-6 h-6 border-2 border-outline rounded-md checked:bg-primary checked:border-primary transition-all cursor-pointer focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" id="backup-confirm" type="checkbox"/>

                </span>

                Continue
            </button>
</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('backup-confirm');
            const button = document.getElementById('continue-btn');

            checkbox.addEventListener('change', (e) => {
                button.disabled = !e.target.checked;
            });
            
            button.addEventListener('click', () => {
                if(!button.disabled) {
                    // Visual feedback for click before navigation
                    button.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm" style="font-variation-settings: \'FILL\' 1;">progress_activity</span>';
                    setTimeout(() => {
                        window.location.href = '#next-step'; // Placeholder for actual navigation
                    }, 500);
                }
            });
        });
    </script>
