<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Checkbox Styles */
        .m3-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid theme('colors.on-surface-variant');
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .m3-checkbox:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }

        .m3-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid theme('colors.on-primary');
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Switch Styles */
        .m3-switch {
            appearance: none;
            width: 52px;
            height: 32px;
            background-color: theme('colors.surface-variant');
            border: 2px solid theme('colors.outline');
            border-radius: 16px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .m3-switch::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: theme('colors.outline');
            border-radius: 50%;
            top: 50%;
            left: 6px;
            transform: translateY(-50%);
            transition: all 0.2s ease-in-out;
        }

        .m3-switch:checked {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }

        .m3-switch:checked::before {
            background-color: theme('colors.on-primary');
            width: 24px;
            height: 24px;
            left: calc(100% - 28px);
        }

    </style>

<script>
        // Simple Select All Logic
        const selectAllSwitch = document.getElementById('selectAll');
        const categoryCheckboxes = document.querySelectorAll('.category-checkbox');

        selectAllSwitch.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            categoryCheckboxes.forEach(checkbox => {
                checkbox.checked = isChecked;
            });
        });

        // Update Select All switch state if individual checkboxes change
        categoryCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const allChecked = Array.from(categoryCheckboxes).every(cb => cb.checked);
                selectAllSwitch.checked = allChecked;
            });
        });
    </script>
