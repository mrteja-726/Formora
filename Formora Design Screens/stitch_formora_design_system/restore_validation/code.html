<style>
        .pulse-bg {
            animation: pulse-light 3s infinite alternate;
        }
        @keyframes pulse-light {
            0% { background-color: rgba(0, 94, 184, 0.02); }
            100% { background-color: rgba(0, 94, 184, 0.08); }
        }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #005eb8, transparent);
            animation: scan 2s linear infinite;
            opacity: 0.5;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col relative overflow-hidden">
<!-- Top App Bar (Suppressed for transactional flow, but keeping brand anchor as per instruction "Use exact labels... TopAppBar". Deciding to show a minimal version for brand presence but no navigation) -->
<header class="bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed font-title-lg text-title-lg w-full top-0 sticky bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center px-lg py-sm w-full z-10 border-b border-surface-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-title-lg" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="text-title-lg font-title-lg font-bold text-primary dark:text-primary-fixed">Formora</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10">
<!-- Animated Background Pulse specific to the flow -->
<div class="absolute inset-0 pulse-bg -z-10 pointer-events-none rounded-3xl m-margin-desktop shadow-[inset_0_0_100px_rgba(0,94,184,0.05)] border border-primary-container/10">
<div class="scanning-line"></div>
</div>
<div class="max-w-md w-full flex flex-col items-center">
<!-- Icon & Heading -->
<div class="mb-xl flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full bg-primary-container/10 flex items-center justify-center mb-lg relative">
<span class="material-symbols-outlined text-[48px] text-primary-container spinner" style="font-variation-settings: 'FILL' 0;">sync</span>
<span class="material-symbols-outlined absolute text-[24px] text-primary-container" style="font-variation-settings: 'FILL' 1;">cloud_sync</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Validating Backup</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please wait while we verify your data security and integrity.</p>
</div>
<!-- Validation Checklist (Bento/Card Style) -->
<div class="w-full bg-surface-container-low rounded-xl border border-surface-variant p-lg shadow-sm mb-3xl flex flex-col gap-lg">
<!-- Item 1: Active -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface relative overflow-hidden shadow-sm border border-primary-container/20">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<div class="flex items-center gap-md ml-sm">
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[16px] spinner">progress_activity</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Integrity Check</p>
<p class="font-label-lg text-label-lg text-primary-container">Validating...</p>
</div>
</div>
</div>
<!-- Item 2: Pending -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface opacity-70">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">bug_report</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Corruption Scan</p>
<p class="font-label-lg text-label-lg text-on-surface-variant">Pending</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-50">pending</span>
</div>
<!-- Item 3: Pending -->
<div class="flex items-center justify-between p-sm rounded-lg bg-surface opacity-70">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">extension</span>
</div>
<div>
<p class="font-title-md text-title-md text-on-surface">Compatibility Check</p>
<p class="font-label-lg text-label-lg text-on-surface-variant">Pending</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-50">pending</span>
</div>
</div>

<div class="w-full mt-auto mb-margin-desktop md:mb-0">
<button class="w-full py-md px-lg rounded-full border border-outline font-title-md text-title-md text-primary hover:bg-surface-variant transition-colors duration-200 flex justify-center items-center gap-sm">
<span class="material-symbols-outlined">close</span>
                    Cancel Validation
                </button>
</div>
</div>
</main>
