<main class="flex-1 overflow-y-auto no-scrollbar px-margin-mobile md:px-margin-desktop py-xl flex flex-col gap-xl max-w-4xl mx-auto w-full relative">
<!-- Step Indicator -->

<div class="absolute inset-y-0 left-0 pl-lg flex items-center pointer-events-none">

</div>
<input class="w-full pl-[52px] pr-lg py-md bg-transparent border-none rounded-xl text-body-lg font-body-lg text-on-surface placeholder-outline focus:ring-0" placeholder="Search by date or profile..." type="text"/>
</div>

<div class="flex flex-col gap-md pb-3xl">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Available Backups</h2>
<!-- Backup Card 1 (Local) -->

<div class="flex items-start gap-lg">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container card-icon transition-colors" data-icon="hard_drive">hard_drive</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start mb-xs">

</div>
<div class="flex items-center gap-md text-on-surface-variant font-body-md text-body-md">
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span> Oct 24, 2023</span>
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="schedule">schedule</span> 14:30</span>
<span class="flex items-center gap-xs ml-auto"><span class="material-symbols-outlined text-[16px]" data-icon="folder">folder</span> 4.2 GB</span>
</div>
</div>
</div>
</button>

</div>
<div class="flex-1 min-w-0">

<button class="bg-surface-variant text-on-surface-variant font-title-md text-title-md px-xl py-md rounded-full transition-all duration-200 cursor-not-allowed opacity-50 flex items-center gap-sm" disabled="" id="nextBtn">

                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Note: BottomNavBar is suppressed as this is a transactional flow -->
<script>
        // Simple micro-interaction logic
        function selectCard(clickedCard) {
            // Remove selected class from all cards
            const allCards = document.querySelectorAll('.backup-card');
            allCards.forEach(card => card.classList.remove('selected'));
            
            // Add selected class to clicked card
            clickedCard.classList.add('selected');

            // Enable Next button
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-50');
            nextBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'cursor-pointer', 'shadow-sm', 'hover:bg-[#00478d]'); // Hardcoded hover for slight darken based on primary
            nextBtn.disabled = false;
        }
    </script>
