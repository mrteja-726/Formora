<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35px;
            }
            100% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -124px;
            }
        }
        
        .animate-svg-dash {
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .pulse-ring-effect {
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- TopAppBar (JSON Sourced - Adapted for Transactional Flow) -->
<header class="w-full top-0 sticky bg-surface flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 z-50">
<button aria-label="Go back" class="text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Vault Backup</h1>
<div class="text-primary p-2 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</header>
<!-- Main Content Canvas - Linear/Transactional Intent (No Nav Shells) -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-desktop relative">
<!-- Ambient Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-primary-container/20 rounded-full blur-[80px] pointer-events-none z-0"></div>
<!-- Central Interactive Progress Area -->
<div class="relative flex flex-col items-center z-10 w-full max-w-md">
<!-- Immersive Progress Circle -->
<div class="relative w-64 h-64 mb-10 flex items-center justify-center">
<!-- Outer pulsing ring for depth -->
<div class="absolute inset-0 border-[1px] border-primary-container/30 rounded-full pulse-ring-effect z-0"></div>
<!-- SVG Spinner Base Track -->
<svg class="absolute inset-0 w-full h-full -rotate-90 z-10" viewbox="0 0 100 100">
<circle class="stroke-surface-container-highest" cx="50" cy="50" fill="none" r="46" stroke-width="2"></circle>
</svg>
<!-- SVG Spinner Animated Track -->
<svg class="absolute inset-0 w-full h-full -rotate-90 z-20 animate-[spin_2s_linear_infinite]" viewbox="0 0 100 100">
<circle class="stroke-primary animate-svg-dash drop-shadow-[0_0_8px_rgba(0,94,184,0.4)]" cx="50" cy="50" fill="none" r="46" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Inner Content (Lock Icon & Percentage) -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-30">
<div class="bg-surface rounded-full p-4 shadow-sm mb-2 border border-surface-container-highest">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface tabular-nums">68%</span>
</div>
</div>
<!-- Status Typography -->
<div class="text-center space-y-3 w-full">
<h2 class="font-headline-lg text-headline-lg md:hidden text-on-surface tracking-tight">Backup in Progress</h2>
<h2 class="font-headline-lg text-headline-lg hidden md:block text-on-surface tracking-tight">Backup in Progress</h2>
<div class="bg-surface-container-low rounded-xl p-4 border border-surface-container-highest/50 shadow-sm backdrop-blur-sm">

<div class="flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] animate-spin">sync</span>

</div>
</div>
</div>
