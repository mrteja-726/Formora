name: formora
description: Formora — Local-first personal profile & document vault. No accounts, no servers.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # ── Navigation ────────────────────────────────────────
  go_router: ^13.2.5

  # ── Local Database (SQL) ─────────────────────────────
  drift: ^2.27.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24

  # ── Local Database (Key-Value) ────────────────────────
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # ── Secure Storage ────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Biometric Authentication ──────────────────────────
  local_auth: ^3.0.1

  # ── Encryption ────────────────────────────────────────
  encrypt: ^5.0.3
  crypto: ^3.0.7
  pointycastle: ^3.9.1

  # ── File Handling ─────────────────────────────────────
  file_picker: ^8.3.7
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.1
  mime: ^2.0.0

  # ── Compression & Backup ──────────────────────────────
  archive: ^4.0.9
  share_plus: ^12.0.2

  # ── OCR (On-device) ───────────────────────────────────
  google_mlkit_text_recognition: ^0.15.1

  # ── PDF Support ───────────────────────────────────────
  pdfx: ^2.9.2

  # ── Permissions ───────────────────────────────────────
  permission_handler: ^12.0.3

  # ── Networking (AI providers only) ───────────────────
  http: ^1.6.0

  # ── Animations ────────────────────────────────────────
  lottie: ^3.3.3
  flutter_animate: ^4.5.2

  # ── Material You / Dynamic Color ─────────────────────
  dynamic_color: ^1.8.1

  # ── Utilities ────────────────────────────────────────
  uuid: ^4.5.3
  intl: ^0.20.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  collection: ^1.19.1
  rxdart: ^0.28.0

  # ── Accessibility ─────────────────────────────────────
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Linting ───────────────────────────────────────────
  flutter_lints: ^6.0.0
  custom_lint: any
  riverpod_lint: any

  # ── Code Generation ───────────────────────────────────
  build_runner: ^2.5.4
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.0
  hive_ce_generator: ^1.9.2
  drift_dev: ^2.27.0

  # ── Testing ───────────────────────────────────────────
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/support/
    - assets/lottie/
    - assets/images/
