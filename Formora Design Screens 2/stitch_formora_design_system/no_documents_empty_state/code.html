<style>
        @keyframes folderEntrance {
            0% { transform: scale(0.85) rotateX(15deg) translateY(20px); opacity: 0; }
            100% { transform: scale(1) rotateX(0deg) translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-folder {
            animation: folderEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            perspective: 1000px;
        }

        .animate-content {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.3s forwards;
        }

        .animate-delay-1 { animation-delay: 0.4s; }
        .animate-delay-2 { animation-delay: 0.5s; }

        .material-symbols-outlined {

<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-white/20 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 animate-ping';
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.left = e.offsetX + 'px';
                ripple.style.top = e.offsetY + 'px';
                btn.classList.add('relative', 'overflow-hidden');
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
