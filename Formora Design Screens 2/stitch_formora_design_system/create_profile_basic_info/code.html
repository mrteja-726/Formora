<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-group:focus-within label {
            transform: translateY(-24px) scale(0.85);
            color: var(--tw-color-primary);
        }
        .input-group label {
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
        .input-field:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
        }
        .glass-card {
            background: rgba(251, 248, 254, 0.8);
            backdrop-filter: blur(12px);
        }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-40 bg-surface-container-low shadow-sm">
<div class="flex justify-between items-center px-lg py-sm w-full max-w-screen-2xl mx-auto">
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Vault AI</h1>
</div>
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-xl pb-32">
<!-- Progress Header -->
<div class="mb-3xl">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Step 2 of 6</span>
<span class="font-label-lg text-label-lg text-primary font-bold">Basic Information</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 33.33%"></div>
</div>
</div>
<!-- Wizard Content -->
<div class="space-y-3xl">
<!-- Photo Upload Section -->
<div class="flex flex-col items-center gap-lg">
<div class="relative">
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-surface-container-high bg-surface-container overflow-hidden group cursor-pointer relative shadow-md">
<img alt="Profile Placeholder" class="w-full h-full object-cover" data-alt="A professional, minimalist close-up portrait of a diverse person against a soft, blurred studio background. The lighting is clean and high-key, matching a premium privacy-focused app aesthetic. The color palette consists of soft whites, cool greys, and a hint of deep blue, creating a serene and intelligent atmosphere. The image is framed perfectly for a circular profile avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBP5D7AX6LEFhnKqpyuvlTsPeA_teufUdAaflZyz57YaNN9jQ01Zpp5oEAg-vt5zMLqJT-77nHE1OeHZbzXM1I6cGH1DZcGFdOrMUOSV1N-qmrSxuiC-GRCFtiMEI_xdV3IZq6ig5idfBXs9WktJZdJ7LdV2bCH2eGn7qklXjSAgSe7Ukvk9DKIwZYLEEJ2SvXzgeOOcMh3OrpxBv8eiNu4BYwB6aTClbegn0eIyaPa43xVeBzAAVaNZJKYMpB9yV1-J1E9K_i9P4Mi"/>
<div class="absolute inset-0 bg-on-surface/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">add_a_photo</span>
</div>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:bg-primary-container active:scale-90 transition-all border-4 border-background">
<span class="material-symbols-outlined text-xl">edit</span>
</button>
</div>
<div class="text-center">
<h2 class="font-title-lg text-title-lg text-on-surface">Upload your photo</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">This helps your team recognize you in secure chats.</p>
</div>
</div>
<!-- Form Section -->
<div class="space-y-xl">
<!-- Name Field -->
<div class="relative input-group">
<input class="w-full h-14 px-lg pt-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-xl transition-all font-body-lg text-body-lg text-on-surface input-field" id="full-name" placeholder=" " type="text"/>
<label class="absolute left-lg top-4 text-on-surface-variant font-body-lg pointer-events-none" for="full-name">Full Name</label>
</div>
<!-- DOB Field -->
<div class="relative input-group">
<input class="w-full h-14 px-lg pt-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-xl transition-all font-body-lg text-body-lg text-on-surface input-field" id="dob" placeholder=" " type="date"/>
<label class="absolute left-lg top-4 text-on-surface-variant font-body-lg pointer-events-none" for="dob">Date of Birth</label>
<span class="material-symbols-outlined absolute right-lg top-4 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
<!-- Gender Field -->
<div class="space-y-sm">
<p class="font-label-lg text-label-lg text-on-surface-variant px-sm">Gender</p>
<div class="grid grid-cols-3 gap-sm">
<button class="gender-btn h-12 flex items-center justify-center gap-xs border border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors active:scale-95 group data-[selected=true]:bg-primary-container data-[selected=true]:border-primary data-[selected=true]:text-on-primary-container" onclick="selectGender(this)">
<span class="material-symbols-outlined text-xl group-data-[selected=true]:text-primary">male</span>
<span class="font-label-lg">Male</span>
</button>
<button class="gender-btn h-12 flex items-center justify-center gap-xs border border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors active:scale-95 group data-[selected=true]:bg-primary-container data-[selected=true]:border-primary data-[selected=true]:text-on-primary-container" onclick="selectGender(this)">
<span class="material-symbols-outlined text-xl group-data-[selected=true]:text-primary">female</span>
<span class="font-label-lg">Female</span>
</button>
<button class="gender-btn h-12 flex items-center justify-center gap-xs border border-outline-variant rounded-xl hover:bg-surface-container-high transition-colors active:scale-95 group data-[selected=true]:bg-primary-container data-[selected=true]:border-primary data-[selected=true]:text-on-primary-container" onclick="selectGender(this)">
<span class="material-symbols-outlined text-xl group-data-[selected=true]:text-primary">diversity_3</span>
<span class="font-label-lg">Other</span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-between pt-xl border-t border-outline-variant/30">
<button class="flex items-center gap-sm px-xl py-3 rounded-full text-primary font-title-md hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
                    Back

<button class="flex items-center gap-sm px-3xl py-3 bg-primary text-on-primary rounded-full font-title-md shadow-lg hover:bg-primary-container active:scale-95 transition-all">
                    Next
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>

<!-- Bottom Navigation Bar (Contextual Profile Mapping) -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-high shadow-lg rounded-t-3xl flex justify-around items-center px-4 py-3 pb-safe">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-colors cursor-pointer active:scale-90 transition-transform">

<span class="font-label-lg text-label-lg">Chat</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-colors cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined">description</span>
<span class="font-label-lg text-label-lg">Files</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-colors cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined">search</span>
<span class="font-label-lg text-label-lg">Search</span>
</div>
<!-- Active: Profile (Since we are in profile wizard) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-5 py-1 cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="font-label-lg text-label-lg">Profile</span>
</div>
</nav>
<script>
        function selectGender(element) {
            // Remove selection from all buttons
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.setAttribute('data-selected', 'false');
            });
            // Add to clicked button
            element.setAttribute('data-selected', 'true');
        }

        // Logic to simulate focus on load if needed
        window.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('focused');
                });
                input.addEventListener('blur', () => {
                    if (input.value === '') {
                        input.parentElement.classList.remove('focused');
                    }
                });
            });
        });
    </script>
</body></html>
