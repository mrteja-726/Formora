<script>
    // Subtle interactivity for the chips
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Mock feedback
        btn.classList.add('bg-primary/5');
        setTimeout(() => btn.classList.remove('bg-primary/5'), 300);
      });
    });

    // Handle background subtle parallax on mouse move for desktop
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 15;
        const y = (e.clientY / window.innerHeight - 0.5) * 15;
        const illustration = document.querySelector('img[src*="IMAGE_79"]');
        if (illustration) {
          illustration.style.transform = `translate(${x}px, ${y}px)`;
        }
      });
    }
